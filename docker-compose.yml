services:
  alert-monitor:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: alert-monitor
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - ./logs:/app/app/logs

    network_mode: host

    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[p]ython.*app.main' > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 3s
