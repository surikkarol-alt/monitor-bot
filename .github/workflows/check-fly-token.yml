name: Check Fly Token

on:
  workflow_dispatch:  # запуск вручную из GitHub

jobs:
  test-fly-token:
    runs-on: ubuntu-latest
    steps:
      - name: Check Fly version
        run: |
          echo "Testing Fly token..."
          fly auth whoami
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
